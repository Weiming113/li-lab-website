<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="News and updates from The Li Lab at UT Arlington." />
    <title>News · The Li Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Oswald:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="media/image6.svg" />
    <script type="module" src="/src/js/main.js"></script>
    <link rel="stylesheet" href="/src/css/main.css" />
  </head>
  <body data-page="news">
    <div id="site-header"></div>
    <main id="main">
      <section class="page-hero" aria-labelledby="hero-title">
        <div class="container">
          <h1 id="hero-title">News</h1>
          <p class="lede">Lab openings, milestones, and announcements.</p>
        </div>
      </section>

      <div class="container">
        <section class="section" aria-labelledby="news-title">
          <h2 id="news-title" class="section-title">Lab News</h2>
          <ol class="timeline">
            <li>
              <p class="timeline-date">January 2027</p>
              <p class="timeline-body">The Li Lab officially opened at the University of Texas at Arlington in the Life Science Building!</p>
              <!--
                ===== 单条新闻配图（需要时取消本注释，并替换下面中文占位）=====
                <figure class="news-figure">
                  <img src="这里替换图片链接" alt="这里替换图片说明" />
                  <figcaption>这里替换图片说明文字</figcaption>
                </figure>
              -->
              <!--
                ===== 带点击跳转的新闻配图（可选，与上一块二选一）=====
                <figure class="news-figure">
                  <a href="这里替换点击后跳转的链接">
                    <img src="这里替换图片链接" alt="这里替换图片说明" />
                  </a>
                  <figcaption>这里替换图片说明文字</figcaption>
                </figure>
              -->
            </li>
          </ol>
          <!--
            ===== 在 LAB NEWS 下方单独插入一张/一组图片的模块（整段默认注释）=====
            用法：取消本注释 → 把中文占位改成真实链接 → 图片建议放到 public/media/ 后写成 media/文件名
            <div class="news-media-block">
              <figure class="news-figure">
                <img src="这里替换图片链接" alt="这里替换图片说明" />
                <figcaption>这里替换图片说明文字</figcaption>
              </figure>
              <figure class="news-figure">
                <a href="这里替换点击后跳转的链接">
                  <img src="这里替换图片链接" alt="这里替换图片说明" />
                </a>
                <figcaption>这里替换图片说明文字</figcaption>
              </figure>
            </div>
          -->
        </section>
      </div>
    </main>
    <div id="site-footer"></div>
  </body>
</html>
